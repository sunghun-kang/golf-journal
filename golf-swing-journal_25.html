function mdLite(t){
  var h=esc(t);
  h=h.replace(/^\s*#{1,6}\s*(.+)$/gm,'<b style="font-size:0.95rem">$1</b>'); // ## 소제목 → 굵게(마커 제거)
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');                              // **굵게**
  return h;
}
function themeAskShow(html){
  var body=document.getElementById('thBody'); if(!body) return;
  var box=document.getElementById('thAskBox');
  if(!box){ box=document.createElement('div'); box.id='thAskBox'; body.insertBefore(box, body.firstChild); }
  box.innerHTML=html;
}
// 🤖질문 문장(q) → 참고할 기록 고르기. 🤖질문과 AI기록 「다시요약」이 같이 씀 → {used, dateLabel}
function themeAskSelect(q){
  // ── 기간 파싱: "9월","2026-09","2026-09-24","10/1","10월1일","9/28~10/5","이번달","지난달" (복수/범위 가능) ──
  var _n=new Date(Date.now()+9*3600*1000), _cy=_n.getUTCFullYear(), _cm=_n.getUTCMonth()+1;
  var dateFrom='', dateTo='', dateLabel='', dateList=[];
  var qd=q;
  var pad2=function(n){ return String(+n).padStart(2,'0'); };
  // "26년"처럼 두 자리 연도는 "2026년"으로 정규화(2000년대로 가정)
  qd=qd.replace(/(^|\s)(\d{2})(\s*년)/g, function(m,pre,yy,yeo){ return pre+'20'+yy+yeo; });
  // 0) 기간 범위("~","-","부터"): "9/28~10/5", "9월28일~10월5일", "2026-09-28~2026-10-05", "9/28부터 10/5까지"
  var rngSep='(?:\\s*[~\\-–—]\\s*|\\s*부터\\s*)';
  var mR;
  if(mR=qd.match(new RegExp('(20\\d{2})\\s*[.\\-\\/]\\s*(\\d{1,2})\\s*[.\\-\\/]\\s*(\\d{1,2})'+rngSep+'(20\\d{2})\\s*[.\\-\\/]\\s*(\\d{1,2})\\s*[.\\-\\/]\\s*(\\d{1,2})'))){
    dateFrom=mR[1]+'-'+pad2(mR[2])+'-'+pad2(mR[3]); dateTo=mR[4]+'-'+pad2(mR[5])+'-'+pad2(mR[6]); qd=qd.replace(mR[0],' ');
  } else if(mR=qd.match(new RegExp('(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일'+rngSep+'(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일'))){
    dateFrom=_cy+'-'+pad2(mR[1])+'-'+pad2(mR[2]); dateTo=_cy+'-'+pad2(mR[3])+'-'+pad2(mR[4]); qd=qd.replace(mR[0],' ');
  } else if(mR=qd.match(new RegExp('(?:^|\\s)(\\d{1,2})\\s*[\\/\\.]\\s*(\\d{1,2})'+rngSep+'(\\d{1,2})\\s*[\\/\\.]\\s*(\\d{1,2})(?:\\s*까지)?'))){
    dateFrom=_cy+'-'+pad2(mR[1])+'-'+pad2(mR[2]); dateTo=_cy+'-'+pad2(mR[3])+'-'+pad2(mR[4]); qd=qd.replace(mR[0],' ');
  } else if(mR=qd.match(new RegExp('(?:^|\\s)(\\d{1,2})\\s*월'+rngSep+'(\\d{1,2})\\s*월(?!\\s*\\d)'))){
    // "10월~8월"처럼 일(day) 없이 달만 범위로 준 경우: 두 달 중 이른 달 1일~늦은 달 말일까지로 처리(입력 순서는 무관)
    var _mA=+mR[1], _mB=+mR[2], _mLo=Math.min(_mA,_mB), _mHi=Math.max(_mA,_mB);
    dateFrom=_cy+'-'+pad2(_mLo)+'-01'; dateTo=_cy+'-'+pad2(_mHi)+'-31'; qd=qd.replace(mR[0],' ');
  }
  if(dateFrom && dateTo){
    if(dateFrom>dateTo){ var _t=dateFrom; dateFrom=dateTo; dateTo=_t; }
    dateLabel=dateFrom+' ~ '+dateTo;
  } else {
    dateFrom='';
    // 1) 연-월(-일) 전체 표기: 2026-09, 2026.9.24, 2026/09/24
    qd=qd.replace(/(20\d{2})\s*[년.\-\/]\s*(\d{1,2})\s*월?\s*(?:[.\-\/]\s*(\d{1,2})\s*일?)?/g, function(m,y,mo,da){
      mo=pad2(mo);
      if(da){ dateList.push(y+'-'+mo+'-'+pad2(da)); }
      else if(!dateFrom){ dateFrom=y+'-'+mo; dateLabel=y+'년 '+(+mo)+'월'; }
      return ' ';
    });
    // 2) 연도 없는 M/D, M.D, M-D (복수 가능): "10/1 10/3 10/4"
    qd=qd.replace(/(?:^|\s)(\d{1,2})\s*[\/\.\-]\s*(\d{1,2})(?!\d)/g, function(m,mo,da){
      if(+mo>=1&&+mo<=12&&+da>=1&&+da<=31){ dateList.push(_cy+'-'+pad2(mo)+'-'+pad2(da)); return ' '; }
      return m;
    });
    // 3) "10월1일"/"10월 1일" (복수 가능)
    qd=qd.replace(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/g, function(m,mo,da){
      dateList.push(_cy+'-'+pad2(mo)+'-'+pad2(da)); return ' ';
    });
    dateList=dateList.filter(function(d,i){ return dateList.indexOf(d)===i; });  // 중복 제거
    if(!dateFrom && !dateList.length){
      var _yOnly;
      if(/올해|금년|올\s*한\s*해/.test(qd)){ dateFrom=String(_cy); dateLabel=_cy+'년'; }                 // 올해 = 그 해 전체
      else if(/작년|지난\s*해|전년/.test(qd)){ dateFrom=String(_cy-1); dateLabel=(_cy-1)+'년'; }
      else if(/이번\s*달|금월|이달/.test(qd)){ dateFrom=_cy+'-'+pad2(_cm); dateLabel='이번달'; }
      else if(/지난\s*달|저번\s*달|전월/.test(qd)){ var _pm=_cm-1,_py=_cy; if(_pm<1){_pm=12;_py--;} dateFrom=_py+'-'+pad2(_pm); dateLabel='지난달'; }
      else if(_yOnly=qd.match(/(20\d{2})\s*년(?!\s*\d)/)){ dateFrom=_yOnly[1]; dateLabel=_yOnly[1]+'년'; }  // "26년"(→2026년 정규화됨)처럼 월 없이 연도만 = 그 해 전체
      else { var _mm2; if(_mm2=qd.match(/(?:^|\s)(\d{1,2})\s*월(?!\s*\d)/)){ dateFrom=_cy+'-'+pad2(_mm2[1]); dateLabel=_cy+'년 '+(+_mm2[1])+'월'; } }  // 연도없는 N월 = 올해 그 달
    }
    if(dateList.length && !dateLabel){ dateLabel=dateList.slice().sort().join(', '); }
  }
  var hasDate=!!(dateFrom||dateTo||dateList.length);
  var inRange=function(r){
    if(dateList.length) return dateList.indexOf(r.date)>=0;
    if(dateTo) return (r.date||'')>=dateFrom && (r.date||'')<=dateTo;
    if(!dateFrom) return true;
    return String(r.date||'').indexOf(dateFrom)===0;
  };
  // ── 구분(타입) 인식: 필드/스크린/인생/영어/회사 → vt 필터 (분석은 동작어라 제외) ──
  var typeMap={'필드':'F','스크린':'S','인생':'L','人生':'L','영어':'E','회사':'C'};
  var wantVt={}; Object.keys(typeMap).forEach(function(w){ if(q.indexOf(w)>=0) wantVt[typeMap[w]]=1; });
  var vtKeys=Object.keys(wantVt);
  var vtNames={F:'필드',S:'스크린',A:'분석',L:'人生',E:'영어',C:'회사'};
  if(vtKeys.length){ dateLabel=(dateLabel?dateLabel+' ':'')+vtKeys.map(function(k){return vtNames[k];}).join('·'); }
  // ── 키워드 토큰(날짜·군말·범용어·타입어 제외) ──
  var stop=/^(나는|나|내|내가|이유|원인|분석|분석해줘|분석해조|해줘|해조|왜|어떻게|무엇|뭐|좀|주라|주세요|알려줘|정리|정리해줘|정리해조|요약|요약해줘|요약해조|요약해|대책|방법|하는|되는|것|거|들|해줄|볼까|어떤|경우|때|더|좀더|관련|모아|모아서|찾아|찾아서|골프|스윙|일지|전체|모두|다|필드|스크린|인생|人生|영어|회사|번|다녀옴|다녀온|간|다시|합쳐서|합쳐|병합|통합|직접|순서대로|내림차순|오름차순|내리차순|오르차순|날짜별로|날자별로)$/;
  // "기록"/"정리"/"요약"처럼 어미만 바뀐 지시어(기록한/기록들/정리해서 등)도 걸러내기 위한 접두 체크
  var stopPrefix=/^(기록|정리|요약|분석|찾아|모아|알려|보여|적어|써줘|해달라|부탁)/;
  var qc=qd.replace(/이번\s*달|지난\s*달|저번\s*달|금월|이달|전월|최근|올해|금년|작년|지난\s*해|전년/g,' ');
  var toks=qc.replace(/[?？.,!·]/g,' ').split(/\s+/).filter(function(w){ return w.length>=2 && !stop.test(w) && !stopPrefix.test(w); });
  var hay=function(r){ return ((r.venue||'')+' '+(r.members||'')+' '+(r.title||'')+' '+(r.memo||'')).toLowerCase(); };
  // "내가 직접/수동으로 쓴/AI 빼고"처럼 AI가 아닌 내 기록만 원하면 AI분석/AI요약/AI정리 기록은 제외
  var wantManualOnly=/내가\s*직접|직접\s*(?:쓴|작성|입력|기록)|수동으로|AI\s*(?:빼고|제외|말고)/i.test(q);
  var pool=(data||[]).filter(function(r){ return r && !r.deleted && String(r.id||'').indexOf('__')!==0 && (!wantManualOnly || !isAIRec(r)); });
  var kwOk=function(r){ return !toks.length || toks.some(function(t){ return hay(r).indexOf(t.toLowerCase())>=0; }); };
  var vtOk=function(r){ return !vtKeys.length || wantVt[r.vt]===1; };
  // 구분(필드·스크린…)을 지정했으면 그 구분 기록은 다 넣음 — 질문의 다른 단어(살로윙 등)는 거르지 않고 「중심 주제」로만 씀 (26-10-24)
  var res=pool.filter(function(r){ return inRange(r) && vtOk(r) && (vtKeys.length ? true : kwOk(r)); });
  if(!res.length && toks.length && (hasDate||vtKeys.length)) res=pool.filter(function(r){ return inRange(r) && vtOk(r); });  // 키워드 완화
  if(!res.length && vtKeys.length && hasDate) res=pool.filter(inRange);                                                     // 타입 완화(기간만)
  if(!res.length && hasDate) res=pool.filter(inRange);
  if(!res.length && toks.length) res=pool.filter(function(r){ return toks.some(function(t){ return hay(r).indexOf(t)>=0; }); });
  res.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  // 구분 지정이면 다 넣어야 하니 상한을 넉넉히(필드 전체 105건 > 100) — 날짜별로 합쳐 보내서 길이 부담 적음
  return {used:res.slice(0, vtKeys.length?250:100), dateLabel:dateLabel, vt:vtKeys, toks:(vtKeys.length?toks:[])};
}
// 🤖질문 프롬프트(시스템·사용자) — 🤖질문과 「다시요약」 공용
function thRecLine(r){
  return (r.score&&scoreHasData(r.score)?(' 스코어:'+scoreForAI(r.score)):'')
    +(r.venue?(' 문제:'+thStrip(r.venue)):'')
    +(r.members?(' 원인:'+thStrip(r.members)):'')
    +(r.title?(' 대책:'+thStrip(r.title).replace(/\n/g,' / ')):'')
    +(r.memo?(' 메모:'+thStrip(r.memo).replace(/\n/g,' ').slice(0,300)):'');
}
// 목록형이면 같은 날 기록을 한 덩어리로 합쳐서 보냄 → AI도 날짜당 한 줄 (같은 날 2건이 따로 나오거나 한쪽만 나오는 것 방지)
function thSrcByDate(used){
  var vtNames={F:'필드',S:'스크린',A:'분석',L:'人生',E:'영어',C:'회사'};
  var by={}, order=[];
  used.forEach(function(r){ var d=r.date||''; if(!by[d]){ by[d]=[]; order.push(d); } by[d].push(r); });
  order.sort().reverse();
  return order.map(function(d){
    var rs=by[d];
    var vts=[]; rs.forEach(function(r){ var n=vtNames[r.vt]; if(n && vts.indexOf(n)<0) vts.push(n); });
    return '['+d+(d?'('+dow(d)+')':'')+']'+(vts.length?(' 구분:'+vts.join('·')):'')
      +(rs.length>1 ? rs.map(function(r,k){ return ' ('+(k+1)+')'+thRecLine(r); }).join('') : thRecLine(rs[0]));
  }).join('\n');
}
function themeAskPrompt(q, used, dateLabel, focusToks){
  var isList=thMustAll(q), isOnlyType=isList && !thIsListQ(q);   // 구분만 지정한 분석 질문도 날짜 전부
  var src=isList ? thSrcByDate(used) : used.map(function(r){
    return '['+(r.date||'')+(r.date?'('+dow(r.date)+')':'')+']'+thRecLine(r);
  }).join('\n');
  var sys='당신은 골프 스윙 코치입니다. 사용자의 골프 일지 기록을 근거로 질문에 한국어로 간결하고 실전적으로 답합니다. 기록에 있는 내용을 우선 근거로 삼고, 기록에 없어 일반 지식으로 보완할 때는 "(일반적으로)"라고 표시하세요. 아래 제공된 기록은 질문어와 기간으로 걸러낸 일부일 뿐, 사용자의 전체 일지가 아닙니다. "기록이 없다/부족하다"처럼 전체 일지에 대한 단정은 하지 말고, "이번에 참고한 자료에는 ~가 포함되어 있지 않음" 식으로 이 분석의 범위 안에서만 말하세요.';
  var user='질문: '+q+(dateLabel?('\n(대상 기간: '+dateLabel+')'):'')+'\n\n아래는 내 골프 일지 기록이야'+(dateLabel?('('+dateLabel+' 기준으로 추린 것)'):'')+'. 이 기록을 근거로 위 질문에 답해줘.\n※ 질문이 정리방식을 지정하면(예: "날짜별로", 시간순, 주제별) 그 방식을 최우선으로 따라줘. 지정이 없으면 (1) 반복되는 핵심 원인 (2) 효과 있었던/권장 대책 (3) 두 줄 핵심요약 구조로. 소제목·불릿으로 간결하게.\n※ 날짜로 인용할 땐 반드시 최신 날짜부터(내림차순)로, 날짜 뒤에 (요일)까지 표기해줘. 예: 09/19(토). 월/일은 반드시 두 자리로 맞춰(3/5 → 03/05).\n맨 마지막에 반드시 아래 형식으로 2줄 핵심요약을 써줘(각 줄 20자 내외):\n핵심요약:\n<첫째 줄 - 핵심 문제>\n<둘째 줄 - 결론/대책>\n\n=== 기록('+used.length+'건'+(dateLabel?(' · '+dateLabel):'')+') ===\n'+src;
  if(isList){
    // 목록형 질문(정리·날짜별·내림차순…)이면 AI가 비슷한 날을 묶으며 날짜를 빠뜨림(26-10-24: 39건 중 9건 누락) → 날짜 전부 명시
    var ds=thUsedDates(used);
    var allRule = isOnlyType
      // 구분(스크린 등)만 지정한 분석 질문: 날짜별 목록(전부) 먼저 + 그다음 분석
      ? '※ 질문이 구분('+dateLabel+')을 지정했으니 그 기록은 전부 다뤄야 해. 기록은 이미 날짜별로 한 줄씩 묶어 '+ds.length+'개 날짜로 줬어(원래 '+used.length+'건). 먼저 「## 날짜별 기록」 아래에 날짜마다 정확히 한 줄 「- **MM/DD(요일)** 내용」으로 '+ds.length+'개 날짜를 하나도 빠뜨리지 말고 모두 쓰고(같은 날은 한 줄), 그다음 「## 분석」에서 질문에 답해줘(반복되는 원인·효과 있던 대책).'
      : '※ 이건 「기록 정리」 요청이야. 기록은 이미 날짜별로 한 줄씩 묶어 '+ds.length+'개 날짜로 줬어(원래 '+used.length+'건). 날짜마다 정확히 한 줄 「- **MM/DD(요일)** 내용」으로, '+ds.length+'개 날짜를 하나도 빠뜨리지 말고 모두 써줘. 같은 날은 반드시 한 줄로(두 줄로 나누지 말 것). 비슷한 내용이어도 묶어서 생략하지 말 것.';
    user=user.replace('\n맨 마지막에 반드시', '\n'+allRule+'\n   반드시 들어가야 할 날짜: '+ds.map(function(d){ return thMD(d); }).join(', ')+'\n맨 마지막에 반드시');
  }
  if(focusToks && focusToks.length){
    // 구분을 지정했을 땐 질문의 다른 단어로 기록을 거르지 않음 → 대신 그 단어 중심으로 분석
    user=user.replace('\n맨 마지막에 반드시', '\n※ 질문에 나온 「'+focusToks.join(', ')+'」을(를) 중심 주제로 삼아 관련 내용을 자세히, 나머지는 짧게.\n맨 마지막에 반드시');
  }
  user=user.replace('\n맨 마지막에 반드시', '\n'+thVenueRule()+'\n맨 마지막에 반드시');
  return {sys:sys, user:user};
}
// 📅 날짜는 MM/DD(요일) 두 자리로 통일 (26-10-24 이사님 지정: 3 → 03, 줄 맞춤)
function thMD(d){ return d.slice(5,7)+'/'+d.slice(8,10)+'('+dow(d)+')'; }
function thDatePad(txt){
  function p(n){ return ('0'+(+n)).slice(-2); }
  function ok(m,d){ return +m>=1 && +m<=12 && +d>=1 && +d<=31; }
  return String(txt||'')
    // 「3/5(목)」「**3/5**(목)」처럼 뒤에 (요일)이 붙은 것 — 3/4 스윙 같은 분수는 안 건드림
    .replace(/(^|[^\d\/.\-])(\d{1,2})\/(\d{1,2})(?=\s*(?:\*\*)?\s*\([일월화수목금토]\))/g, function(m,pre,a,b){ return ok(a,b)? pre+p(a)+'/'+p(b) : m; })

<script>

var MTG_TYPES=[{k:'월간',c:'#1a4d9e'},{k:'AI',c:'#7a3fb8'},{k:'주간',c:'#2d7a2d'},{k:'품질',c:'#0d8a8a'},{k:'업무',c:'#c76a00'}];
var MTG_MIGRATE={'월간회의':'월간','AI회의':'AI','주간회의':'주간','품질회의':'품질','업무회의':'업무'};
function mtgMigrateTypes(){ var ch=false; (meetings||[]).forEach(function(m){ if(m && MTG_MIGRATE[m.type]){ m.type=MTG_MIGRATE[m.type]; ch=true; } }); return ch; }
var meetings=[];
var mtgY=new Date(new Date().getTime()+9*3600*1000).getFullYear();
var mtgM=new Date(new Date().getTime()+9*3600*1000).getMonth(); // 0-11
var mtgEditId=null;
function mtgColor(t){ for(var i=0;i<MTG_TYPES.length;i++){ if(MTG_TYPES[i].k===t) return MTG_TYPES[i].c; } return '#666'; }
function mtgMerge(a,b){
  var map={};
  (a||[]).forEach(function(x){ if(x&&x.id) map[x.id]=x; });
  (b||[]).forEach(function(x){ if(!x||!x.id) return; var cur=map[x.id]; if(!cur || (x.updatedAt||'')>(cur.updatedAt||'')) map[x.id]=x; });
  return Object.keys(map).map(function(k){return map[k];});
}
function mtgSaveLocal(){
  var payload; try{ payload=JSON.stringify(meetings); }catch(e){ return; }
  try{ if(IDB){ IDB.transaction('kv','readwrite').objectStore('kv').put(payload,'meetings'); } }catch(e){}
  try{ localStorage.setItem('meetings',payload); }catch(e){}
}
function mtgLoadLocal(cb){
  function fromLS(){ try{ var s=localStorage.getItem('meetings'); meetings=s?(JSON.parse(s)||[]):[]; }catch(e){ meetings=[]; } if(cb)cb(); }
  if(IDB){ try{ var rq=IDB.transaction('kv','readonly').objectStore('kv').get('meetings'); rq.onsuccess=function(){ if(rq.result){ try{ meetings=JSON.parse(rq.result)||[]; }catch(e){ meetings=[]; } if(cb)cb(); } else fromLS(); }; rq.onerror=fromLS; return; }catch(e){} }
  fromLS();
}
function mtgPush(){
  try{ postRows([{id:'__meetings__', data:{id:'__meetings__', list:meetings, updatedAt:nowKST()}, updated_at:new Date().toISOString()}]).catch(function(){}); }catch(e){}
}
function mtgPull(cb){
  try{
    fetch(SUPABASE_URL+'/rest/v1/golf_posts?id=eq.__meetings__&select=data',{headers:sbH()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(arr){
      var srv=(arr&&arr[0]&&arr[0].data&&Array.isArray(arr[0].data.list))?arr[0].data.list:[];
      var merged=mtgMerge(meetings, srv);
      var _b=''; try{_b=JSON.stringify(meetings);}catch(e){}
      var _sv=''; try{_sv=JSON.stringify(srv);}catch(e){}
      var _a=''; try{_a=JSON.stringify(merged);}catch(e){}
      meetings=merged;
      if(_a!==_b) mtgSaveLocal();       // 로컬 반영
      if(_a!==_sv) mtgPush();           // 서버에 없던 내용 올림
      if(cb)cb();
    }).catch(function(){ if(cb)cb(); });
  }catch(e){ if(cb)cb(); }
}
function mtgCountLive(list){ return (list||[]).filter(function(m){return m && !m.deleted;}).length; }
function mtgReadServer(){
  return fetch(SUPABASE_URL+'/rest/v1/golf_posts?id=eq.__meetings__&select=data',{headers:sbH()})
    .then(function(r){ if(!r.ok) throw new Error('읽기 HTTP '+r.status); return r.json(); })
    .then(function(arr){ return (arr&&arr[0]&&arr[0].data&&Array.isArray(arr[0].data.list))?arr[0].data.list:[]; });
}
function mtgSyncNow(){
  var myN0=mtgCountLive(meetings);
  mtgReadServer()
  .then(function(srv){
    var srvN=mtgCountLive(srv);
    meetings=mtgMerge(meetings, srv); mtgSaveLocal();
    var myN=mtgCountLive(meetings);
    // 올리기
    return postRows([{id:'__meetings__',data:{id:'__meetings__',list:meetings,updatedAt:nowKST()},updated_at:new Date().toISOString()}])
      .then(function(){
        // 올린 뒤 서버 재확인(진짜 저장됐는지)
        return mtgReadServer().then(function(srv2){
          var srvN2=mtgCountLive(srv2);
          mtgRenderCal();
          if(srvN2>=myN && myN>0){
            alert('✅ 동기화 완료\n\n올리기 전 서버: '+srvN+'건\n내 기기: '+myN+'건\n올린 뒤 서버 재확인: '+srvN2+'건 ✔\n\n서버에 정상 저장됐어요. 다른 기기에서 🔄 누르면 받아집니다.');
          } else {
            alert('⚠️ 올렸는데 서버에 안 남아요!\n\n올린 뒤 서버 재확인: '+srvN2+'건 (기대: '+myN+'건)\n\n→ 서버 쓰기가 거부되는 상태예요(권한/RLS 등). 이 메시지를 그대로 알려주세요.');
          }
        });
      })
      .catch(function(e){ mtgRenderCal(); alert('⚠️ 서버 저장(올리기) 실패\n'+String(e)+'\n\n읽기는 됨(서버 '+srvN+'건, 내 기기 '+myN+'건). 서버 쓰기 권한/네트워크 문제.'); });
  })
  .catch(function(e){ alert('⚠️ 서버 읽기 실패\n'+String(e)+'\n\n네트워크/서버 접속 문제. 내 기기 회의: '+myN0+'건'); });
}
function openMtg(){
  var t=new Date(new Date().getTime()+9*3600*1000);
  mtgY=t.getFullYear(); mtgM=t.getMonth();

  try{ gcalPrewarm(); }catch(e){}
  mtgLoadLocal(function(){ mtgRenderCal(); mtgPull(function(){ mtgRenderCal(); }); });
}
function closeMtg(){ document.getElementById('mtg-ov').style.display='none'; }
function mtgPrev(){ mtgM--; if(mtgM<0){mtgM=11;mtgY--;} mtgRenderCal(); }
function mtgNext(){ mtgM++; if(mtgM>11){mtgM=0;mtgY++;} mtgRenderCal(); }
function mtg2(n){ return (n<10?'0':'')+n; }
function mtgDateStr(y,m,d){ return y+'-'+mtg2(m+1)+'-'+mtg2(d); }
function mtgForDate(ds){ return meetings.filter(function(x){ return !x.deleted && x.date===ds; }); }
function mtgWeekNo(y,m,d){ var dt=new Date(y,m,d); var jan1=new Date(y,0,1); var doy=Math.floor((dt-jan1)/86400000)+1; return Math.ceil((doy+jan1.getDay())/7); }
function mtgTypeChange(){ var t=document.getElementById('mtgType').value; var a=document.getElementById('mtgAtt'); if(!a) return; if(t==='품질'){ if(a.value==='회장님') a.value=''; } else { if(a.value==='') a.value='회장님'; } }
function mtgDedup(){
  var groups={}, changed=false;
  (meetings||[]).forEach(function(m){ if(!m||m.deleted) return; var k=m.date+'|'+m.type; (groups[k]=groups[k]||[]).push(m); });
  Object.keys(groups).forEach(function(k){
    var arr=groups[k]; if(arr.length<2) return;
    function sc(m){ return ((m.attendees||'').trim()?1:0)+((m.report||'').trim()?2:0)+((m.orders||'').trim()?2:0); }
    arr.sort(function(a,b){ var d=sc(b)-sc(a); if(d) return d; return (b.updatedAt||'')>(a.updatedAt||'')?1:-1; });
    for(var i=1;i<arr.length;i++){ arr[i].deleted=true; arr[i].updatedAt=nowKST(); changed=true; }
  });
  return changed;
}
function mtgFixQuality(){ var ch=false; (meetings||[]).forEach(function(m){ if(!m||m.deleted) return;
  if(m.type==='품질'){ if((m.attendees||'')==='회장님'){ m.attendees=''; m.updatedAt=nowKST(); ch=true; } }
  else { if(!(m.attendees||'').trim()){ m.attendees='회장님'; m.updatedAt=nowKST(); ch=true; } }
}); return ch; }
function mtgRemoveHolidayAuto(){
  if(typeof HOLIDAYS==='undefined') return false;
  var AUTO={'월간':1,'AI':1,'주간':1,'품질':1}; var ch=false;
  (meetings||[]).forEach(function(m){ if(!m||m.deleted) return;
    if(AUTO[m.type] && HOLIDAYS.has(m.date) && !(m.report||'').trim() && !(m.orders||'').trim()){ m.deleted=true; m.updatedAt=nowKST(); ch=true; }
  });
  return ch;
}
function mtgRenderCal(){
  var _ch=false; if(mtgMigrateTypes()) _ch=true; if(mtgFixQuality()) _ch=true; if(mtgRemoveHolidayAuto()) _ch=true; if(mtgDedup()) _ch=true; if(_ch){ mtgSaveLocal(); mtgPush(); }
  var head=document.getElementById('mtgTitle'); if(head) head.textContent=mtgY+'년 '+(mtgM+1)+'월';
  var first=new Date(mtgY,mtgM,1); var startDow=first.getDay(); var days=new Date(mtgY,mtgM+1,0).getDate();
  var dows=['일','월','화','수','목','금','토'];
  var h='<div style="display:grid;grid-template-columns:0.5fr 1fr 1fr 1fr 1fr 1fr 0.5fr;gap:1px;background:#ddd;border:1px solid #ddd">';
  dows.forEach(function(d,i){ h+='<div style="background:#eef;padding:4px 0;text-align:center;font-weight:700;font-size:0.8rem;color:'+(i===0?'#d42020':i===6?'#1a6ac0':'#333')+'">'+d+'</div>'; });
  for(var b=0;b<startDow;b++){ h+='<div style="background:#fafafa;min-height:170px"></div>'; }
  for(var day=1;day<=days;day++){
    var ds=mtgDateStr(mtgY,mtgM,day);
    var dow=new Date(mtgY,mtgM,day).getDay();
    var list=mtgForDate(ds);
    var mt=list[0];
    var isHol=(typeof HOLIDAYS!=='undefined')&&HOLIDAYS.has(ds);
    var holName=isHol?HOLIDAYS.get(ds):'';
    var dcol=(isHol||dow===0)?'#d42020':(dow===6?'#1a6ac0':'#444');
    h+='<div onclick="mtgAdd(\''+ds+'\')" style="background:'+(isHol?'#fdeceb':'#fff')+';min-height:170px;padding:3px 4px;cursor:pointer;position:relative;vertical-align:top">';
    // 날짜 + 회의이름(같은 줄)
    h+='<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">';
    h+='<span style="font-size:0.78rem;font-weight:700;color:'+dcol+'">'+day+'</span>';
    if(isHol){ h+='<span style="font-size:0.6rem;color:#d42020;font-weight:700">'+esc(holName)+'</span>'; }
    if(dow===0){ h+='<span style="font-size:0.6rem;color:#c98;font-weight:700">'+mtgWeekNo(mtgY,mtgM,day)+'주</span>'; }
    if(mt){
      h+='<span onclick="event.stopPropagation();mtgEdit(\''+mt.id+'\')" style="background:'+mtgColor(mt.type)+';color:#fff;border-radius:4px;padding:1px 6px;font-size:0.68rem;font-weight:700;cursor:pointer">'+esc(mt.type)+'</span>';
      if((mt.attendees||'').trim()){ h+='<span onclick="event.stopPropagation();mtgEdit(\''+mt.id+'\')" style="font-size:0.72rem;color:#333;font-weight:600;cursor:pointer">'+esc(mt.attendees.trim())+'</span>'; }
    }
    h+='</div>';
    if(mt){
      var parts=[];
      if((mt.report||'').trim()) parts.push(mt.report.trim());
      if((mt.orders||'').trim()) parts.push('📢 '+mt.orders.trim());
      var body=parts.join('\n');
      if(body) h+='<div onclick="event.stopPropagation();mtgEdit(\''+mt.id+'\')" style="padding:2px 1px 0;font-size:0.74rem;line-height:1.4;white-space:pre-wrap;word-break:break-word;color:#333;cursor:pointer">'+esc(body)+'</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('mtgCal').innerHTML=h;
}
function mtgAutoFill(){
  if(!confirm(mtgY+'년 '+(mtgM+1)+'월의 정기회의(월간=첫 월요일, AI=둘째 월요일, 주간=매주 수요일, 품질=매주 목요일)를 빈 양식으로 추가할까요?')) return;
  var days=new Date(mtgY,mtgM+1,0).getDate(); var firstMon=0;
  for(var d=1;d<=days;d++){ if(new Date(mtgY,mtgM,d).getDay()===1){ firstMon=d; break; } }
  function addIf(ds,type){ if(typeof HOLIDAYS!=='undefined'&&HOLIDAYS.has(ds)) return; /* 공휴일엔 정기회의 안 넣음 */ if(!meetings.some(function(x){return !x.deleted&&x.date===ds&&x.type===type;})){ meetings.push({id:'mtg_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:type,date:ds,attendees:(type==='품질'?'':'회장님'),report:'',orders:'',updatedAt:nowKST()}); } }
  if(firstMon){ addIf(mtgDateStr(mtgY,mtgM,firstMon),'월간'); var ai=firstMon+7; if(ai<=days) addIf(mtgDateStr(mtgY,mtgM,ai),'AI'); }
  for(var d2=1;d2<=days;d2++){ var dw=new Date(mtgY,mtgM,d2).getDay(); if(dw===3) addIf(mtgDateStr(mtgY,mtgM,d2),'주간'); if(dw===4) addIf(mtgDateStr(mtgY,mtgM,d2),'품질'); }
  mtgSaveLocal(); mtgPush(); mtgRenderCal();
}
function mtgOpts(sel){ return MTG_TYPES.map(function(t){ return '<option'+(t.k===sel?' selected':'')+'>'+t.k+'</option>'; }).join(''); }
function mtgAdd(ds){
  mtgEditId=null;
  document.getElementById('mtgFTitle').textContent='회의 추가';
  document.getElementById('mtgType').innerHTML=mtgOpts('주간');
  document.getElementById('mtgDate').value=ds||mtgDateStr(mtgY,mtgM,1);
  document.getElementById('mtgAtt').value='회장님';
  document.getElementById('mtgReport').value='';
  document.getElementById('mtgOrders').value='';
  document.getElementById('mtgDelBtn').style.display='none';
  document.getElementById('mtgForm').style.display='flex';
}
function mtgEdit(id){
  var m=meetings.filter(function(x){return x.id===id;})[0]; if(!m) return;
  mtgEditId=id;
  document.getElementById('mtgFTitle').textContent='회의 수정';
  document.getElementById('mtgType').innerHTML=mtgOpts(m.type);
  document.getElementById('mtgDate').value=m.date||'';
  document.getElementById('mtgAtt').value=m.attendees||'';
  document.getElementById('mtgReport').value=m.report||'';
  document.getElementById('mtgOrders').value=m.orders||'';
  document.getElementById('mtgDelBtn').style.display='';
  document.getElementById('mtgForm').style.display='flex';
}
function mtgFormClose(){ document.getElementById('mtgForm').style.display='none'; }
function mtgSaveForm(){
  var date=document.getElementById('mtgDate').value;
  if(!date){ alert('날짜를 넣어주세요.'); return; }
  var rec={ type:document.getElementById('mtgType').value, date:date,
    attendees:document.getElementById('mtgAtt').value.trim(),
    report:document.getElementById('mtgReport').value.trim(),
    orders:document.getElementById('mtgOrders').value.trim(),
    updatedAt:nowKST() };
  if(mtgEditId){ var m=meetings.filter(function(x){return x.id===mtgEditId;})[0]; if(m){ m.type=rec.type;m.date=rec.date;m.attendees=rec.attendees;m.report=rec.report;m.orders=rec.orders;m.updatedAt=rec.updatedAt;m.deleted=false; } }
  else { rec.id='mtg_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); meetings.push(rec); }
  mtgSaveLocal(); mtgPush(); mtgFormClose(); mtgRenderCal();
}
function mtgDelForm(){
  if(!mtgEditId) return; if(!confirm('이 회의를 삭제할까요?')) return;
  var m=meetings.filter(function(x){return x.id===mtgEditId;})[0]; if(m){ m.deleted=true; m.updatedAt=nowKST(); }
  mtgSaveLocal(); mtgPush(); mtgFormClose(); mtgRenderCal();
}
function mtgImport(){
  var input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange=function(e){ var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(ev){ try{ var arr=JSON.parse(ev.target.result); if(!Array.isArray(arr)) throw 0;
      arr.forEach(function(x){ if(x&&!x.id) x.id='mtg_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); if(x&&!x.updatedAt) x.updatedAt=nowKST(); });
      var before=meetings.length; meetings=mtgMerge(meetings,arr);
      mtgSaveLocal(); mtgPush(); mtgRenderCal();
      alert('회의 가져오기 완료: '+before+' → '+meetings.filter(function(z){return !z.deleted;}).length+'개');
    }catch(er){ alert('파일 형식이 올바르지 않습니다.'); } };
    rd.readAsText(f);
  };
  input.click();
}
// ===== 구글 캘린더 연동 가져오기 =====
var gcalItems=[];
function gcalPad(n){ return (n<10?'0':'')+n; }
function gcalClientId(reset){
  if(reset){ try{ localStorage.removeItem('gcalClientId'); }catch(e){} }
  var cid=''; try{ cid=localStorage.getItem('gcalClientId')||''; }catch(e){}
  if(!cid){
    cid=prompt('구글 OAuth 클라이언트 ID를 입력하세요 (xxxxx.apps.googleusercontent.com).\n\n[처음 한 번만 설정]\n1) Google Cloud Console → API 및 서비스 → 사용자 인증 정보\n2) "OAuth 클라이언트 ID 만들기" → 웹 애플리케이션\n3) 승인된 JavaScript 원본에 아래 주소를 추가:\n   '+location.origin+'\n4) Calendar API 사용 설정\n5) 만들어진 클라이언트 ID를 여기에 붙여넣기\n\n(폰/PC에만 저장되며 서버로 안 보냅니다.)');
    if(cid){ cid=cid.trim(); try{ localStorage.setItem('gcalClientId',cid); }catch(e){} }
  }
  return cid;
}
function gcalKeyReset(){ gcalClientId(true); alert('구글 클라이언트 ID를 지웠어요. 다시 [📅 구글캘린더]를 누르면 새로 입력합니다.'); gcalClose(); }
var gcalGISloaded=false, gcalTokenClient=null, gcalTCid='';
function gcalLoadGIS(cb){
  if(window.google && google.accounts && google.accounts.oauth2){ gcalGISloaded=true; if(cb)cb(true); return; }
  var s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
  s.onload=function(){ gcalGISloaded=!!(window.google&&google.accounts&&google.accounts.oauth2); if(cb)cb(gcalGISloaded); };
  s.onerror=function(){ if(cb)cb(false); };
  document.head.appendChild(s);
}
function gcalInitClient(cid){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)) return false;
  if(gcalTokenClient && gcalTCid===cid) return true;
  try{
    gcalTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/calendar.readonly',
      callback:function(resp){ if(resp && resp.access_token){ gcalFetch(resp.access_token); } else { alert('구글 인증에 실패했어요.'); } },
      error_callback:function(err){ var ty=(err&&err.type)||''; if(ty==='popup_failed_to_open'){ alert('팝업이 차단됐어요.\n브라우저 주소창의 팝업 차단을 허용하고 [📅 구글캘린더]를 다시 눌러주세요.'); } else if(ty==='popup_closed'){ /* 사용자가 닫음 */ } else { alert('구글 인증 오류: '+ty+'\n승인된 원본에 '+location.origin+' 이 등록됐는지(반영에 수분~수시간), 클라이언트 ID가 맞는지 확인하세요.'); } }
    });
    gcalTCid=cid; return true;
  }catch(e){ alert('구글 인증 초기화 실패: '+e); return false; }
}
// 미리 로드해두면 클릭 즉시 팝업이 열려 popup_failed_to_open 방지
function gcalPrewarm(){
  gcalLoadGIS(function(ok){ if(!ok) return; var c=''; try{ c=localStorage.getItem('gcalClientId')||''; }catch(e){} if(c) gcalInitClient(c); });
}
function gcalConnect(){
  var had=false; try{ had=!!localStorage.getItem('gcalClientId'); }catch(e){}
  var cid=gcalClientId(false); if(!cid) return;
  // 모듈이 아직이면 로드만 하고 한 번 더 누르게 안내(클릭 제스처 유지 위해)
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){
    gcalLoadGIS(function(ok){ if(ok){ gcalInitClient(cid); alert('구글 로그인 모듈이 준비됐어요.\n[📅 구글캘린더]를 한 번 더 눌러주세요.'); } else { alert('구글 로그인 모듈을 불러오지 못했어요. 인터넷 연결을 확인하세요.'); } });
    return;
  }
  if(!gcalInitClient(cid)){ alert('잠시 후 [📅 구글캘린더]를 다시 눌러주세요.'); return; }
  // 클라이언트 ID를 방금 처음 입력했다면 제스처가 소모됐을 수 있어 재클릭 안내
  if(!had){ alert('클라이언트 ID가 저장됐어요.\n[📅 구글캘린더]를 한 번 더 눌러 로그인하세요.'); return; }
  gcalTokenClient.requestAccessToken();
}
function gcalGuessType(t){
  t=t||'';
  if(/품질/.test(t)) return '품질';
  if(/월간/.test(t)) return '월간';
  if(/\bAI\b|AI/.test(t)) return 'AI';
  if(/주간/.test(t)) return '주간';
  return '업무';
}
function gcalFetch(token){
  document.getElementById('gcalModal').style.display='flex';
  document.getElementById('gcalSub').textContent=mtgY+'년 '+(mtgM+1)+'월 일정 불러오는 중…';
  document.getElementById('gcalList').innerHTML='<div style="padding:16px;text-align:center;color:#999">불러오는 중…</div>';
  var gA=document.getElementById('gcalAll'); if(gA) gA.checked=false;
  var nY=(mtgM===11)?mtgY+1:mtgY, nMnum=(mtgM===11)?1:mtgM+2;
  var tmin=mtgY+'-'+gcalPad(mtgM+1)+'-01T00:00:00+09:00';
  var tmax=nY+'-'+gcalPad(nMnum)+'-01T00:00:00+09:00';
  var url='https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250'
    +'&timeMin='+encodeURIComponent(tmin)+'&timeMax='+encodeURIComponent(tmax);
  fetch(url,{headers:{'Authorization':'Bearer '+token}})
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(j.error){ document.getElementById('gcalList').innerHTML='<div style="padding:16px;color:#c0392b">오류: '+esc(j.error.message||'')+'</div>'; return; }
    var items=(j.items||[]).filter(function(e){ return e.status!=='cancelled' && (e.start&&(e.start.dateTime||e.start.date)); });
    gcalRender(items);
  }).catch(function(e){ document.getElementById('gcalList').innerHTML='<div style="padding:16px;color:#c0392b">통신 실패: '+esc(String(e))+'</div>'; });
}
function gcalRender(items){
  gcalItems=items.map(function(e){
    var st=e.start.dateTime?e.start.dateTime.slice(0,10):e.start.date;
    return { id:e.id, date:st, title:e.summary||'(제목없음)', desc:e.description||'' };
  });
  document.getElementById('gcalSub').textContent=mtgY+'년 '+(mtgM+1)+'월 · 일정 '+gcalItems.length+'개';
  var box=document.getElementById('gcalList');
  if(!gcalItems.length){ box.innerHTML='<div style="padding:20px;text-align:center;color:#999">이 달에 일정이 없어요. 위 ◀▶로 달을 바꿔보세요.</div>'; return; }
  var h='';
  gcalItems.forEach(function(it,i){
    var g=gcalGuessType(it.title);
    var opts=MTG_TYPES.map(function(t){ return '<option'+(t.k===g?' selected':'')+'>'+t.k+'</option>'; }).join('');
    var chk=/회의|미팅|회장|보고/.test(it.title)?' checked':'';
    h+='<label style="display:flex;gap:7px;align-items:flex-start;padding:7px 2px;border-bottom:1px solid #f2f2f2">'
      +'<input type="checkbox" class="gcalChk" data-idx="'+i+'"'+chk+' style="margin-top:4px">'
      +'<span style="flex:1;min-width:0"><span style="font-size:0.72rem;color:#888">'+esc(it.date)+'</span>'
      +'<span style="font-size:0.9rem;display:block;word-break:break-all">'+esc(it.title)+'</span></span>'
      +'<select class="gcalType" data-idx="'+i+'" style="font-size:0.78rem;padding:4px;border:1px solid #ccc;border-radius:5px;flex-shrink:0">'+opts+'</select>'
      +'</label>';
  });
  box.innerHTML=h;
}
function gcalToggleAll(on){ var cs=document.querySelectorAll('#gcalList .gcalChk'); for(var i=0;i<cs.length;i++){ cs[i].checked=on; } }
function gcalClose(){ document.getElementById('gcalModal').style.display='none'; }
function gcalImport(){
  var chks=document.querySelectorAll('#gcalList .gcalChk');
  var types=document.querySelectorAll('#gcalList .gcalType');
  var picked=[];
  for(var i=0;i<chks.length;i++){
    if(!chks[i].checked) continue;
    var idx=parseInt(chks[i].getAttribute('data-idx'),10);
    var it=gcalItems[idx]; if(!it) continue;
    var type=types[i]?types[i].value:'업무';
    picked.push({ id:'gcal_'+String(it.id).replace(/[^A-Za-z0-9_]/g,''), type:type, date:it.date,
      attendees:(type==='품질'?'':'회장님'), report:(it.title||'')+(it.desc?('\n'+it.desc):''), orders:'', updatedAt:nowKST() });
  }
  if(!picked.length){ alert('가져올 일정을 체크하세요.'); return; }
  var before=meetings.filter(function(z){return !z.deleted;}).length;
  meetings=mtgMerge(meetings, picked);
  mtgSaveLocal(); mtgPush(); gcalClose(); mtgRenderCal();
  alert('구글 캘린더에서 '+picked.length+'개 가져왔어요. (총 '+before+' → '+meetings.filter(function(z){return !z.deleted;}).length+'개)');
}

// ===== 📸 현재 화면 스크린샷 (html2canvas 지연로딩 → 공유/저장) =====
function _snapDL(blob,name){ var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},2000); }
function _snapRun(){
  var btn=document.getElementById("snapBtn");
  var prev=btn?btn.innerHTML:""; if(btn){ btn.innerHTML="⏳"; btn.style.visibility="hidden"; }
  try{
    html2canvas(document.body,{ x:window.scrollX, y:window.scrollY, width:window.innerWidth, height:window.innerHeight,
      useCORS:true, backgroundColor:"#efefea", scale:Math.min(2,(window.devicePixelRatio||1)) })
    .then(function(canvas){
      if(btn){ btn.style.visibility="visible"; btn.innerHTML=prev; }
      canvas.toBlob(function(blob){
        if(!blob){ alert("캡처 실패(다시 시도)"); return; }
        var name="강Story_"+(typeof stampKST==="function"?stampKST():Date.now())+".png";
        try{ var file=new File([blob],name,{type:"image/png"});
          if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(function(){}); return; }
        }catch(e){}
        _snapDL(blob,name);
      },"image/png");
    }).catch(function(e){ if(btn){ btn.style.visibility="visible"; btn.innerHTML=prev; } alert("캡처 오류: "+e); });
  }catch(e){ if(btn){ btn.style.visibility="visible"; btn.innerHTML=prev; } alert("캡처 오류: "+e); }
}
function snapShot(){
  if(window.html2canvas){ _snapRun(); return; }
  var btn=document.getElementById("snapBtn"); if(btn) btn.innerHTML="⏳";
  var s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  s.onload=function(){ _snapRun(); };
  s.onerror=function(){ if(btn) btn.innerHTML="📸"; alert("스크린샷 도구 로딩 실패(인터넷 확인 후 다시)"); };
  document.head.appendChild(s);
}
</script>
